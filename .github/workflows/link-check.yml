name: Link check

on:
  push:
    paths: ["**/*.md", "scripts/check_links.py"]
  pull_request:
    paths: ["**/*.md", "scripts/check_links.py"]
  schedule:
    - cron: "17 6 * * 1" # weekly, Monday 06:17 UTC
  workflow_dispatch:

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check links
        run: python3 scripts/check_links.py
